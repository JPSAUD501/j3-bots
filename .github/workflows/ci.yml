name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Installs vp, the Node.js version in package.json `engines` and the pnpm
      # version in `packageManager`, then the workspace. pnpm refuses to change
      # the lockfile when CI is set.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        run: vp run lint

      - name: Format
        run: vp run fmt:check

      # A second user of the machine, whom the admin socket test runs a
      # connection as (`sudo -u`): it must be refused.
      - name: Another user
        run: sudo useradd --no-create-home --shell /usr/sbin/nologin j3-other

      # The browser driver's tests run on the runner's own Chrome, over fake pages
      # the tests serve themselves.
      - name: Test
        run: vp run test
        env:
          J3_TEST_OTHER_USER: j3-other
          J3_TEST_CHROMIUM: /usr/bin/google-chrome

      # Builds the web client and fails when a window's first load grows past
      # apps/web/bundle-budget.json (docs/operations/performance.md).
      - name: Web budget
        if: ${{ !cancelled() }}
        run: vp run web-budget

      # A development server of this checkout on the pinned engine, whose
      # scripted agent calls J3 Bots' own tools through the real `j3` bridge:
      # a primary bot builds a team in one turn. Downloads the engine.
      - name: Scripted
        if: ${{ !cancelled() }}
        run: vp run --filter @j3-bots/server scripted

      - name: Unused code
        run: vp run knip

  signoff:
    name: Sign-off
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history, so both ends of the pull request's range are here.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Every commit the pull request adds is signed off by its author
      # (CONTRIBUTING.md). Commits already on the base branch, and merge
      # commits, are not checked. A pull request's checkout is GitHub's merge
      # of it into its base: the first parent is the base as GitHub merged it, the
      # second the pull request's head.
      - name: Every commit is signed off
        run: scripts/check-signoff.sh HEAD^1 HEAD^2

  # The workflows, checked with actionlint, which runs the runner image's
  # shellcheck on their scripts. actionlint is a pinned release, checked
  # against its digest before it runs.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          VERSION: 1.7.7
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Check the workflows
        run: '"$RUNNER_TEMP/actionlint" -no-color'

  desktop:
    name: Desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The display the smoke's window opens on.
      - name: Install Xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Electron's install script, which the smoke runs, reads this cache before
      # it downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      # Builds the web client and the app, then launches it, pairs with a test
      # server on loopback and sends a bot a message.
      - name: Smoke
        run: xvfb-run -a vp run --filter @j3-bots/desktop smoke

      - name: Upload what the window showed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-failure
          path: apps/desktop/smoke-failure.png
          if-no-files-found: ignore

  # The desktop packages as the release builds them, without publishing them,
  # each with the server runtime of its platform (docs/operations/releasing.md),
  # which is then run where it was packaged. It writes each package's size to
  # the log and the job's summary.
  packages:
    name: Desktop packages (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            targets: --linux --x64
            runtime: linux-unpacked/resources/server-runtime
          - name: mac
            os: macos-15
            targets: --mac --x64 --arm64
            runtime: mac-arm64/J3 Bots.app/Contents/Resources/server-runtime
          - name: windows
            os: windows-2025
            targets: --win --x64
            runtime: win-unpacked/resources/server-runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VERSION: 0.0.0-ci.${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # A version of its own, set as the release sets the tag's, so that the
      # check below proves the runtime and the app carry the version given.
      - name: Version
        working-directory: apps/server
        run: npm pkg set version="$VERSION"

      - name: Build the server runtime
        run: node scripts/build-release.ts --server-runtime

      - name: Build the web client and the app
        run: |
          vp run --filter @j3-bots/web build
          vp run --filter @j3-bots/desktop build

      # Signed as a tag signs it: electron-builder skips signing for a pull
      # request unless told to, and the macOS build is signed ad hoc, with no
      # certificate and so no secret, as the runtime it carries is too.
      - name: Package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is several flags, split on purpose.
          vp exec -- electron-builder $TARGETS --publish never -c.extraMetadata.version="$VERSION"

      - name: Check the packaged server runtime
        env:
          RUNTIME: apps/desktop/release/${{ matrix.runtime }}
        run: node scripts/check-server-runtime.ts "$RUNTIME" --version "$VERSION"

      - name: Package sizes
        working-directory: apps/desktop/release
        run: |
          {
            echo "| Package | Size |"
            echo "| --- | --- |"
            for file in *.AppImage *.deb *.dmg *.zip *.exe; do
              [[ -f "$file" ]] || continue
              echo "| \`$file\` | $(( $(wc -c < "$file") )) bytes |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows server
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Every server test builds a home in the temporary folder, with a
      # database that syncs each commit to disk. The runner's %TEMP% is on its
      # system drive, whose disk is many times slower than the workspace's
      # and at times stalls for a minute, timing out tests across files. So
      # the job's temporary folder is on the workspace's drive, private to
      # this user as a profile's %TEMP% is: only the user, SYSTEM and the
      # Administrators may open it, which a home made inside it inherits.
      # That drive makes no 8.3 short names, which a system drive does and
      # tests of a home named by one need, so it is set to make them.
      - name: Keep temporary files on the workspace's drive
        run: |
          $drive = Split-Path -Qualifier $env:RUNNER_TEMP
          fsutil 8dot3name set 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fsutil 8dot3name set $drive 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fsutil 8dot3name query $drive
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Path $temp | Out-Null
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $temp /inheritance:r /grant:r "*${user}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test the engine adapter
        run: vp run --filter @j3-bots/engine-t3 test

      - name: Test the server
        if: ${{ !cancelled() }}
        run: vp run --filter @j3-bots/server test

      # The built server as the desktop app runs it, on the pinned Node: the
      # engine downloaded and started, a device over the inherited pipe, a
      # scripted turn through the engine, and a stop that leaves no process.
      - name: Smoke
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          vp run --filter @j3-bots/server build
          J3_SERVER_ENTRY="$PWD/apps/server/dist/bin.mjs" vp run --filter @j3-bots/server smoke:windows

  release:
    name: Release archive (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          # Built as a nightly, whose release's tag is its version with no
          # `v`, so the smoke installs both kinds of release.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            nightly: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The version the nightly workflow would name after this one, set as
      # the release workflow sets it.
      - name: Version as a nightly's
        if: matrix.nightly
        shell: bash
        working-directory: apps/server
        run: |
          version="$(../../scripts/nightly-version.sh "$(npm pkg get version | tr -d '"')" "$(date -u +%Y%m%d)" "$GITHUB_RUN_NUMBER")"
          npm pkg set version="$version"

      # The web client and the server bundle, with the pinned Node for this
      # runner's platform, checked against its checksum in package.json.
      - name: Build
        run: vp run release

      # Unpacks the archive and runs it with every folder that holds a node
      # dropped from PATH: doctor, the server, its web client, and one bot turn
      # on the pinned engine through the scripted agent. Then installs it with
      # scripts/install.sh from a local mirror of a release, without the
      # service (a runner has no systemd user manager), and removes it with
      # `j3-bots uninstall --delete-data`.
      - name: Smoke
        run: |
          archive=$(ls "$GITHUB_WORKSPACE"/dist/release/j3-bots-*-${{ matrix.platform }}.tar.gz)
          J3_RELEASE_ARCHIVE="$archive" vp run --filter @j3-bots/server smoke:release
