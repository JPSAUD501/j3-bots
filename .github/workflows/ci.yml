name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Installs vp, the Node.js version in package.json `engines` and the pnpm
      # version in `packageManager`, then the workspace. pnpm refuses to change
      # the lockfile when CI is set.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        run: vp run lint

      - name: Format
        run: vp run fmt:check

      - name: Test
        run: vp run test

      - name: Unused code
        run: vp run knip

  signoff:
    name: Sign-off
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history, so both ends of the pull request's range are here.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Every commit the pull request adds is signed off by its author
      # (CONTRIBUTING.md). Commits already on the base branch, and merge
      # commits, are not checked. A pull request's checkout is GitHub's merge
      # of it into its base: the first parent is the base as GitHub merged it, the
      # second the pull request's head.
      - name: Every commit is signed off
        run: scripts/check-signoff.sh HEAD^1 HEAD^2

  desktop:
    name: Desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The display the smoke's window opens on.
      - name: Install Xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Electron's install script, which the smoke runs, reads this cache before
      # it downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      # Builds the web client and the app, then launches it, pairs with a test
      # server on loopback and sends a bot a message.
      - name: Smoke
        run: xvfb-run -a vp run --filter @j3-bots/desktop smoke

      - name: Upload what the window showed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-failure
          path: apps/desktop/smoke-failure.png
          if-no-files-found: ignore

  release:
    name: Release archive (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The web client and the server bundle, with the pinned Node for this
      # runner's platform, checked against its checksum in package.json.
      - name: Build
        run: vp run release

      # Unpacks the archive and runs it with every folder that holds a node
      # dropped from PATH: doctor, the server, its web client, and one bot turn
      # on the pinned engine through the scripted agent. Then installs it with
      # scripts/install.sh from a local mirror of a release, without the
      # service (a runner has no systemd user manager), and removes it with
      # `j3-bots uninstall --delete-data`.
      - name: Smoke
        run: |
          archive=$(ls "$GITHUB_WORKSPACE"/dist/release/j3-bots-*-${{ matrix.platform }}.tar.gz)
          J3_RELEASE_ARCHIVE="$archive" vp run --filter @j3-bots/server smoke:release
