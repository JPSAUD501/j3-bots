# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Builds a release when a version tag is pushed: a draft GitHub release for
# the tag; the desktop app's packages with electron-updater's feed files, each
# with the server runtime of its platform where local mode runs; the
# server's archives for linux-x64 and linux-arm64; the Android app's signed
# APK; scripts/install.sh; SHA256SUMS of all of them and its signature; and
# then their upload to the draft. A maintainer reads the draft and publishes
# it: installed apps are offered, and install.sh finds, only a published
# release. The nightly workflow (nightly.yml) calls it for a build of `main`
# with the version it names, and publishes that one itself, as a
# pre-release. See docs/operations/releasing.md.
#
# Only a pushed `v*` tag or the nightly on `main` runs it, never a pull
# request, so no code from a fork runs here. Every job but `android-sign` and
# `sign` uses the run's own GITHUB_TOKEN and no other secret: the desktop
# builds are unsigned, and `android` builds the APK unsigned. `android-sign`
# reads the four secrets that hold the key that signs the APK, in the
# `android-signing` environment; `sign` reads the key that signs SHA256SUMS,
# in the `release-signing` environment. Both environments admit only `v*`
# tags, which only admins may create (the "release tags" ruleset), and the
# branch `main`, where the nightly runs. A nightly's tag is its bare version,
# 1.2.4-nightly.20261124.57, outside `v*`: the workflow token that creates
# and deletes nightly tags therefore opens neither environment. Neither job
# runs code from the repository or the build. Only the two jobs that run no code from the repository may write:
# `draft` creates the release and `publish` uploads to it. The jobs that build
# read, and the last job of each build hands what it made to `checksums` and
# `publish` as a `release-*` artifact; each such job is in the `needs` of
# both, which a job added later joins too, or `publish` refuses to upload a
# file SHA256SUMS does not list.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      nightly-version:
        description: The nightly's version, x.y.z-nightly.YYYYMMDD.run (scripts/nightly-version.sh).
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # A pushed tag names the version the packages carry: v1.2.3, or a
      # release candidate, v1.2.3-rc.1. The nightly names its own,
      # 1.2.4-nightly.20261124.57, and only the nightly may: a pushed tag of
      # that form is refused. A nightly's tag is its version with no `v`, so
      # that it stays outside the `v*` tags the signing environments admit. Only the versions the Android app can number
      # are taken: this is the grammar and the limits of androidVersionCode
      # (apps/mobile/src/androidVersionCode.ts), which the Android build runs.
      # This job may write, so it runs no code from the repository and checks
      # the version itself; a change to either check is made to both. Bracket
      # ranges match only ASCII in the C locale, so the check holds whatever
      # locale the runner has.
      - name: Check the version
        id: version
        shell: bash
        env:
          LC_ALL: C
          NIGHTLY_VERSION: ${{ inputs.nightly-version }}
        run: |
          number='(0|[1-9][0-9]*)'
          if [[ -n "$NIGHTLY_VERSION" ]]; then
            version="$NIGHTLY_VERSION"
            if ! [[ "$version" =~ ^$number\.$number\.$number-nightly\.([0-9]{8})\.[1-9][0-9]{0,8}$ ]]; then
              echo "::error::$version is not a nightly's version, x.y.z-nightly.YYYYMMDD.run."
              exit 1
            fi
            day="${BASH_REMATCH[4]}" rc=
            # A real day from 2026-01-01, whose days from then, plus one, are
            # the stage of the Android version code, below 9,000.
            if [[ "$(date -u -d "$day" +%Y%m%d 2> /dev/null)" != "$day" ]] ||
              (($(date -u -d "$day" +%s) < $(date -u -d 20260101 +%s) || $(date -u -d "$day" +%s) > $(date -u -d 20500821 +%s))); then
              echo "::error::$version is dated $day, which is not a day from 2026-01-01 to 2050-08-21, the nightlies the Android app can number."
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^$number\.$number\.$number(-rc\.([1-9][0-9]*))?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not v followed by x.y.z or x.y.z-rc.n, the versions a tag may name."
              exit 1
            fi
            rc="${BASH_REMATCH[5]}"
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          # Lengths first, so no number is too long for the shell's arithmetic.
          if ((${#major} > 2 || major > 20 || ${#minor} > 2 || ${#patch} > 2 || ${#rc} > 2)) || [[ "$rc" == 99 ]]; then
            echo "::error::$version is outside what the Android app can number: a major version up to 20, a minor and a patch up to 99, a release candidate up to rc.98."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$NIGHTLY_VERSION" ]]; then
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      # A release and its release candidates carry the notes committed on the
      # tagged commit as docs/releases/v<x.y.z>.md: the server's build writes
      # their "What's new" into the j3-app skill, and builds none without
      # them. Read through the API, since this job runs nothing of the
      # repository's. A nightly carries none.
      - name: Check the release notes
        if: inputs.nightly-version == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/v${VERSION%%-*}.md"
          if ! gh api "repos/$GH_REPO/contents/$notes?ref=$GITHUB_SHA" --silent; then
            echo "::error::$notes is not on the tagged commit. Commit the release's notes there before tagging: docs/operations/releasing.md, Cutting a release."
            exit 1
          fi

      # The draft's notes give the certificate's digest, and a re-run keeps a
      # draft that exists, so the digest must be right before it is written.
      - name: Check the certificate's digest
        shell: bash
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if ! [[ "$ANDROID_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The repository variable ANDROID_CERT_SHA256 is not a SHA-256 in lowercase hex without colons. docs/operations/releasing.md says how to set it."
            exit 1
          fi

      # A version with a pre-release part (1.2.3-rc.1, or a nightly) is
      # drafted as a pre-release, so publishing it never makes it the latest
      # release, which apps on a release version read. A pushed tag's draft is
      # made on the tag; a nightly's on the commit it builds, and its tag is
      # made when `publish` publishes it.
      - name: Create the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NIGHTLY: ${{ inputs.nightly-version != '' }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          wanted=false
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then wanted=true; prerelease=(--prerelease); fi
          # A draft made by hand, or by an earlier try of this run, is used
          # only if it is marked as the version says.
          if marked="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2> /dev/null)"; then
            if [[ "$marked" != "$wanted" ]]; then
              echo "::error::The release for $TAG exists and is $([[ "$marked" == true ]] || echo "not ")marked as a pre-release, which its version says it $([[ "$wanted" == true ]] && echo "is" || echo "is not")."
              exit 1
            fi
            echo "A release for $TAG exists already; the files are uploaded to it only if it is a draft."
            exit 0
          fi
          notes="The desktop builds are unsigned. macOS and Windows warn before opening an unsigned app. A Mac build and the deb say when a newer version is out; the AppImage and the Windows install update themselves. Linux packages need no signature. The server installs on x64 and arm64 Linux with systemd: \`curl -fsSL https://github.com/$GH_REPO/releases/download/$TAG/install.sh | sh -s -- --version $VERSION\`. SHA256SUMS holds the SHA-256 of every other file of the release, and SHA256SUMS.sig its Ed25519 signature with the J3 Bots release key (release-keys/ in the repository), which install.sh, the server and the apps check before they trust a digest. The Android app is j3-bots-$VERSION-android-arm64.apk: install it on the phone and allow installs from the app that opens it. Its signing certificate's SHA-256 is $ANDROID_CERT_SHA256."
          if [[ "$NIGHTLY" == true ]]; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "J3 Bots $VERSION (nightly)" \
              --notes "A nightly build of main at $GITHUB_SHA, published without review. Nightlies are for trying what comes next; the last seven are kept. $notes"
          else
            gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag \
              --title "J3 Bots $VERSION" --notes "$notes"
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # `runtime` is where the package for this runner's own platform
          # holds its server runtime, which the job runs once packaged.
          - name: linux
            os: ubuntu-24.04
            targets: --linux --x64
            runtime: linux-unpacked/resources/server-runtime
          - name: mac
            os: macos-15
            targets: --mac --x64 --arm64
            runtime: mac-arm64/J3 Bots.app/Contents/Resources/server-runtime
          - name: windows
            os: windows-2025
            targets: --win --x64
            runtime: win-unpacked/resources/server-runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      # The server runtime the package carries for local mode: the server
      # bundle and the pinned Node for this runner's platform, checked against
      # its checksum in package.json. It carries the tag's version, which the
      # package checks it against, so the server's package.json gets it too,
      # as in the server job. The mac runner is Apple Silicon: the x64 build,
      # for which no runtime is built, carries none.
      - name: Version from the tag
        working-directory: apps/server
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Build the server runtime
        run: node scripts/build-release.ts --server-runtime

      - name: Build the web client and the app
        run: |
          vp run --filter @j3-bots/web build
          vp run --filter @j3-bots/desktop build

      # electron-builder signs nothing: no certificate is given, and on macOS
      # it would otherwise look for one in the keychain. It publishes nothing
      # either; it still writes the feed files, from its `publish` settings.
      - name: Package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ needs.draft.outputs.version }}
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is several flags, split on purpose.
          vp exec -- electron-builder $TARGETS --publish never -c.extraMetadata.version="$VERSION"

      # The runtime as packaged (and, on macOS, signed) runs on this runner:
      # its release.json and files are right for the tag, its Node is the
      # pinned one, its server prints `j3-bots v<tag's version>` and starts.
      - name: Check the packaged server runtime
        env:
          RUNTIME: apps/desktop/release/${{ matrix.runtime }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: node scripts/check-server-runtime.ts "$RUNTIME" --version "$VERSION"

      # The packages, their block maps and the feed files (latest-linux.yml,
      # latest-mac.yml or latest.yml, which a build for GitHub writes for a
      # pre-release too), not electron-builder's own records.
      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      # The tag names the version the archive carries, as it does the desktop
      # packages': the server reads its version from its package.json, which
      # only this run's copy changes.
      - name: Version from the tag
        working-directory: apps/server
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: npm pkg set version="$VERSION"

      # The web client and the server bundle, with the pinned Node for this
      # runner's platform, checked against its checksum in package.json.
      - name: Build
        run: vp run release

      # What CI runs on every pull request, on the archive that is published:
      # the archive with no Node on PATH, and install.sh from a local mirror.
      - name: Smoke
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive=$(ls "$GITHUB_WORKSPACE"/dist/release/j3-bots-*-"$PLATFORM".tar.gz)
          J3_RELEASE_ARCHIVE="$archive" vp run --filter @j3-bots/server smoke:release

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The Android app's release build, for arm64 phones: the production variant,
  # with its JavaScript bundled and no development client. It is built without
  # an Expo or a Firebase project, so it cannot turn push notifications on. The
  # build is unsigned (plugins/unsignedRelease.js) and this job holds no
  # secret: Gradle runs build scripts and plugins from node_modules and
  # downloads from Maven repositories, so the key never comes near it.
  # `android-sign` signs what it builds.
  android:
    name: Android (build)
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP_VARIANT: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      # The app takes its version, and its version code, from its package.json
      # (app.config.ts), which only this run's copy changes, as the server job
      # does. `draft` has refused any version the version code cannot be made
      # from; androidVersionCode refuses it again when the config is read.
      - name: Version from the tag
        working-directory: apps/mobile
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Generate the native project
        working-directory: apps/mobile
        run: vp exec -- expo prebuild --platform android --no-install

      # The build's Gradle plugins come from the Gradle Plugin Portal, which
      # now and then does not answer for a while, and Gradle's own retries
      # last seconds. Configuring the build resolves every plugin, so this
      # step does only that and tries again after a pause; the build then
      # takes the plugins from Gradle's cache. A failure that outlasts three
      # tries is the build's own, and Gradle's message says what it is.
      - name: Resolve the Gradle plugins
        working-directory: apps/mobile/android
        run: |
          for try in 1 2 3; do
            if ./gradlew help --no-daemon -PreactNativeArchitectures=arm64-v8a; then exit 0; fi
            if ((try < 3)); then
              echo "::warning::Configuring the build failed (try $try of 3); trying again in $((try * 60)) seconds."
              sleep $((try * 60))
            fi
          done
          exit 1

      - name: Build
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # An intermediate: its name is not `release-*`, so `publish` never takes it.
      - name: Hand the unsigned APK to the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  # Signs the APK `android` built, with the key in the `android-signing`
  # environment, whose four secrets this job alone reads. The environment
  # admits only `v*` tags and the branch `main`, so whoever may push such a tag
  # or merge to `main` may use the key: the repository's "release tags"
  # ruleset lets only admins create, move or delete a `v*` tag, and gives no
  # bypass to GitHub Actions, and `main` takes a change only through a pull
  # request and its checks. Nightly tags are outside `v*`. The job checks
  # nothing out, installs nothing and runs nothing from the repository or the
  # build: only the runner image's own `apksigner` and `zipalign`, on the APK's
  # bytes. That keeps the key from the build, not the build from the key: the
  # job signs whatever `android` built, and the draft's review before it is
  # published is what checks it, as it does every other file. The keystore is
  # on disk from the step that writes it to the step that deletes it, which
  # runs even when signing fails; the passwords reach `apksigner` through its
  # environment, never its command line.
  android-sign:
    name: Android (sign)
    needs: [draft, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-signing
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::${missing[*]} not set: the secrets in the android-signing environment, the certificate's digest as a repository variable. docs/operations/releasing.md says how to create them."
            exit 1
          fi
          if ! [[ "$ANDROID_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_CERT_SHA256 is not a SHA-256 in lowercase hex without colons."
            exit 1
          fi

      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned

      - name: Find the build tools
        run: echo "BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          mkdir -p signed
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "signed/j3-bots-$VERSION-android-arm64.apk" unsigned/app-release-unsigned.apk

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Every signature the APK carries must be made with one certificate, the
      # release's, which a phone compares each update against: the digests
      # `apksigner` prints for its schemes (v2, v3) must come to exactly one,
      # equal to ANDROID_CERT_SHA256. Its native libraries must stay aligned to
      # 16 KB pages, which Android 15 devices with 16 KB pages need. The
      # certificate's name and digest are public.
      - name: Check the signature and the alignment
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          apk="signed/j3-bots-$VERSION-android-arm64.apk"
          certificates="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
          grep -E 'certificate (DN|SHA-256 digest)' <<< "$certificates"
          digests="$(sed -n 's/.*certificate SHA-256 digest: //p' <<< "$certificates" | sort -u)"
          if [[ "$digests" != "$ANDROID_CERT_SHA256" ]]; then
            echo "::error::The APK's signatures are not all made with the release certificate (ANDROID_CERT_SHA256)."
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: signed/j3-bots-${{ needs.draft.outputs.version }}-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS of every file the release publishes: the desktop packages and
  # their feed files, the server archives, the APK as `android-sign` signed it,
  # and install.sh. Each line is `<sha256>  <name>`, as `sha256sum` writes it,
  # sorted by name (docs/operations/releasing.md#what-verifies-a-release). Everything that
  # installs a release checks a download against it, once `sign` has signed
  # it. It reads files and runs none of them.
  checksums:
    name: Checksums and install script
    needs: [desktop, server, android-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the install script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false

      - name: Download what the jobs built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release

      # Each artifact is in a folder of its own, release/<name>/. This job's
      # and `sign`'s own, from an earlier try of the run, are not built files.
      # SHA256SUMS names files, not their folders, so no two may share a name,
      # as `publish` checks again. GitHub renames an asset whose name has any
      # other character than these (a space becomes a dot), and the name
      # SHA256SUMS gives must be the one the release serves, so a name is
      # checked as written.
      - name: Write SHA256SUMS
        env:
          LC_ALL: C
        run: |
          rm -rf release/release-checksums release/release-signature
          mkdir checksums
          cp scripts/install.sh checksums/
          unsafe="$(find release checksums -type f -printf '%f\n' | grep -Ev '^[A-Za-z0-9][A-Za-z0-9._-]*$' || true)"
          if [[ -n "$unsafe" ]]; then
            echo "::error::Files have a name GitHub would change on upload; use only letters, digits, '.', '_' and '-', starting with a letter or a digit: $unsafe"
            exit 1
          fi
          duplicates="$(find release checksums -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Files built by more than one job share a name: $duplicates"
            exit 1
          fi
          find release checksums -type f -print0 |
            while IFS= read -r -d '' file; do
              printf '%s  %s\n' "$(sha256sum < "$file" | cut -d' ' -f1)" "${file##*/}"
            done | LC_ALL=C sort -k2 > SHA256SUMS
          mv SHA256SUMS checksums/
          cat checksums/SHA256SUMS

      - name: Hand them to the sign and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: |
            checksums/SHA256SUMS
            checksums/install.sh
          if-no-files-found: error
          retention-days: 7

  # Signs SHA256SUMS with the release key, the secret RELEASE_SIGNING_KEY of
  # the `release-signing` environment, which this job alone reads. The
  # environment admits only `v*` tags and `main`, as `android-signing` does
  # (see `android-sign`). As `android-sign` does, the job installs nothing and
  # runs nothing from the repository or the build: it checks out only the
  # public keys in release-keys/, which are data, and runs the runner image's
  # own `openssl` on SHA256SUMS's bytes. The key is on disk, readable by the
  # runner's user only, from the step that writes it to the step that deletes
  # it, which runs even when signing fails. The signature is then checked
  # with the public keys committed at the commit being built, so a key that
  # is not the release's never signs a release: the keys in release-keys/,
  # which this build carries, or one in release-keys/retiring/, which only a
  # release that hands installs over to a new key has
  # (docs/operations/releasing.md#if-the-key-leaks). SHA256SUMS.sig is the
  # 64-byte Ed25519 signature in base64, one line.
  sign:
    name: Sign SHA256SUMS
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-signing
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the signing secret
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::RELEASE_SIGNING_KEY is not set in the release-signing environment. docs/operations/releasing.md says how to set it."
            exit 1
          fi

      - name: Checkout the public keys
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            release-keys/*.pem
            release-keys/retiring/*.pem
          sparse-checkout-cone-mode: false

      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: checksums

      - name: Write the signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"

      - name: Sign
        run: |
          mkdir signature
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-signing.pem" -rawin -in checksums/SHA256SUMS |
            openssl base64 -A > signature/SHA256SUMS.sig
          echo >> signature/SHA256SUMS.sig

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.pem"

      # One line of 88 characters, the base64 of 64 bytes, made by one of the
      # keys that install.sh, the server and the apps carry, or by a retiring
      # key, which the installs this release replaces carry and it does not.
      - name: Check the signature with the release keys
        run: |
          openssl version
          if ! grep -Eqx '[A-Za-z0-9+/]{86}==' signature/SHA256SUMS.sig || [[ "$(wc -c < signature/SHA256SUMS.sig)" != 89 ]]; then
            echo "::error::SHA256SUMS.sig is not one line of base64 of an Ed25519 signature."
            exit 1
          fi
          openssl base64 -d -A -in signature/SHA256SUMS.sig -out "$RUNNER_TEMP/signature"
          verifies() {
            openssl pkeyutl -verify -pubin -inkey "$1" -rawin -in checksums/SHA256SUMS -sigfile "$RUNNER_TEMP/signature" > /dev/null 2>&1
          }
          shopt -s nullglob
          for key in release-keys/*.pem; do
            if verifies "$key"; then
              echo "SHA256SUMS is signed by $key."
              exit 0
            fi
          done
          for key in release-keys/retiring/*.pem; do
            if verifies "$key"; then
              echo "::warning::SHA256SUMS is signed by the retiring key $key, which this release no longer carries: it is the release that hands installs over to the keys in release-keys/."
              exit 0
            fi
          done
          echo "::error::The signature does not verify with any key in release-keys/ or release-keys/retiring/: RELEASE_SIGNING_KEY is not a release key."
          exit 1

      - name: Hand the signature to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: signature/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to the draft
    needs: [draft, desktop, server, android-sign, checksums, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download what the jobs built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release

      # Each job's files go in a directory of their own: two with the same
      # name would overwrite each other on the release.
      - name: Check no two files share a name
        run: |
          duplicates="$(find release -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Files built by more than one job share a name: $duplicates"
            exit 1
          fi

      # SHA256SUMS lists exactly the files uploaded beside it, each with the
      # digest of the bytes uploaded: a job whose files reach `publish` but
      # not `checksums` would otherwise publish a file nothing can check.
      - name: Check SHA256SUMS lists every file
        run: |
          sums="$(find release -type f -name SHA256SUMS)"
          find release -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig -print0 |
            while IFS= read -r -d '' file; do
              printf '%s  %s\n' "$(sha256sum < "$file" | cut -d' ' -f1)" "${file##*/}"
            done | LC_ALL=C sort -k2 > "$RUNNER_TEMP/expected"
          if ! diff -u "$RUNNER_TEMP/expected" "$sums"; then
            echo "::error::SHA256SUMS does not list exactly the files to upload, with their digests."
            exit 1
          fi

      # Never onto a published release: what installed apps already read
      # changes only through a new version. Nor onto a draft whose pre-release
      # mark someone changed while the run built: publishing a pre-release
      # as a release would offer it to every app on a release version.
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          read -r draft marked < <(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$draft" != "true" ]]; then
            echo "::error::The release for $TAG is not a draft; nothing is uploaded to it."
            exit 1
          fi
          wanted=false
          if [[ "$VERSION" == *-* ]]; then wanted=true; fi
          if [[ "$marked" != "$wanted" ]]; then
            echo "::error::The draft for $TAG is $([[ "$marked" == true ]] || echo "not ")marked as a pre-release, which its version says it $([[ "$wanted" == true ]] && echo "is" || echo "is not"); nothing is uploaded to it. Set the mark back on the draft, then re-run this job."
            exit 1
          fi
          find release -type f -print0 | xargs -0 gh release upload "$TAG" --clobber

      # The draft may be one that existed before this run, made by hand or by
      # an earlier try, and the upload replaces only files of the same name.
      # So the draft as GitHub holds it must have exactly SHA256SUMS, its
      # signature and the files SHA256SUMS lists, each fully uploaded, or
      # nothing is published from it: a file someone else put on it would
      # otherwise be published beside the signed ones.
      - name: Check the draft holds only the signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          sums="$(find release -type f -name SHA256SUMS)"
          { printf '%s\n' SHA256SUMS SHA256SUMS.sig; cut -c67- "$sums"; } | LC_ALL=C sort > "$RUNNER_TEMP/signed"
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .state] | @tsv' > "$RUNNER_TEMP/assets"
          not_uploaded="$(awk -F'\t' '$2 != "uploaded" { print $1 }' "$RUNNER_TEMP/assets")"
          if [[ -n "$not_uploaded" ]]; then
            echo "::error::Files on the draft for $TAG are not fully uploaded: $not_uploaded"
            exit 1
          fi
          cut -f1 "$RUNNER_TEMP/assets" | LC_ALL=C sort > "$RUNNER_TEMP/on-draft"
          if ! diff -u "$RUNNER_TEMP/signed" "$RUNNER_TEMP/on-draft"; then
            echo "::error::The draft for $TAG does not hold exactly SHA256SUMS, SHA256SUMS.sig and the files SHA256SUMS lists. A line marked + is a file nobody signed: delete it from the draft, then re-run this job."
            exit 1
          fi

      # A nightly is published as soon as its files are up, as a pre-release,
      # which makes its tag, the bare version, on the commit it was built
      # from. A pushed tag's draft waits for a maintainer.
      - name: Publish the nightly
        if: inputs.nightly-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false
