# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Builds a release when a version tag is pushed: a draft GitHub release for
# the tag; the desktop app's packages with electron-updater's feed files; the
# server's archives for linux-x64 and linux-arm64, with SHA256SUMS and
# scripts/install.sh; the Android app's signed APK; and then their upload to
# the draft. A maintainer reads the draft and publishes it: installed apps are
# offered, and install.sh finds, only a published release. See
# docs/operations/releasing.md.
#
# Only a pushed `v*` tag runs it, never a pull request, so no code from a fork
# runs here. Every job but `android` uses the run's own GITHUB_TOKEN and no
# other secret: the desktop builds are unsigned. `android` alone reads the
# four ANDROID_* secrets, the key that signs the APK, which only a tag a
# maintainer pushed can reach. Only the two jobs that run no code from the
# repository may write: `draft` creates the release and `publish` uploads to
# it. The jobs that build read, and hand what they built to `publish` as
# `release-*` artifacts; each such job is in `publish`'s `needs`, which a job
# added later joins too, or its files are left out.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tag names the version the packages carry: v1.2.3 or v1.2.3-beta.1.
      - name: Version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$version" =~ ^$number\.$number\.$number(-$identifier(\.$identifier)*)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not v followed by a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A version with a pre-release part (1.2.3-beta.1) is drafted as a
      # pre-release, so publishing it never makes it the latest release,
      # which apps on a release version read.
      - name: Create the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wanted=false
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then wanted=true; prerelease=(--prerelease); fi
          # A draft made by hand is used only if it is marked as the tag says.
          if marked="$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2> /dev/null)"; then
            if [[ "$marked" != "$wanted" ]]; then
              echo "::error::The release for $GITHUB_REF_NAME exists and is $([[ "$marked" == true ]] || echo "not ")marked as a pre-release, which its version says it $([[ "$wanted" == true ]] && echo "is" || echo "is not")."
              exit 1
            fi
            echo "A release for $GITHUB_REF_NAME exists already; the files are uploaded to it only if it is a draft."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" --verify-tag \
            --title "J3 Bots $VERSION" \
            --notes "The desktop builds are unsigned. macOS and Windows warn before opening an unsigned app. A Mac build and the deb say when a newer version is out; the AppImage and the Windows install update themselves. Linux packages need no signature. The server installs on x64 and arm64 Linux with systemd: \`curl -fsSL https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/install.sh | sh -s -- --version $VERSION\`. SHA256SUMS holds the digest of each server archive and of install.sh. The Android app is j3-bots-$VERSION-android-arm64.apk, signed: install it on the phone and allow installs from the app that opens it."

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            targets: --linux --x64
          - name: mac
            os: macos-15
            targets: --mac --x64 --arm64
          - name: windows
            os: windows-2025
            targets: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      - name: Build the web client and the app
        run: |
          vp run --filter @j3-bots/web build
          vp run --filter @j3-bots/desktop build

      # electron-builder signs nothing: no certificate is given, and on macOS
      # it would otherwise look for one in the keychain. It publishes nothing
      # either; it still writes the feed files, from its `publish` settings.
      - name: Package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ needs.draft.outputs.version }}
          TARGETS: ${{ matrix.targets }}
        run: vp exec -- electron-builder $TARGETS --publish never -c.extraMetadata.version="$VERSION"

      # The packages, their block maps and the feed files (latest-linux.yml,
      # latest-mac.yml, latest.yml, or the pre-release channel's), not
      # electron-builder's own records.
      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      # The tag names the version the archive carries, as it does the desktop
      # packages': the server reads its version from its package.json, which
      # only this run's copy changes.
      - name: Version from the tag
        working-directory: apps/server
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: npm pkg set version="$VERSION"

      # The web client and the server bundle, with the pinned Node for this
      # runner's platform, checked against its checksum in package.json.
      - name: Build
        run: vp run release

      # What CI runs on every pull request, on the archive that is published:
      # the archive with no Node on PATH, and install.sh from a local mirror.
      - name: Smoke
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive=$(ls "$GITHUB_WORKSPACE"/dist/release/j3-bots-*-"$PLATFORM".tar.gz)
          J3_RELEASE_ARCHIVE="$archive" vp run --filter @j3-bots/server smoke:release

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The Android app's release build, signed with the key in the repository's
  # secrets: the production variant, with its JavaScript bundled and no
  # development client, for arm64 phones. It is built without an Expo or a
  # Firebase project, so it cannot turn push notifications on.
  android:
    name: Android
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP_VARIANT: production
      # Android updates an installed app only to a version code that is not
      # lower; the run number grows with each run of this workflow.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::The repository secrets ${missing[*]} are not set, so the APK cannot be signed. docs/operations/releasing.md says how to create them."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true

      # Expo takes the app's version from its package.json, which only this
      # run's copy changes, as the server job does.
      - name: Version from the tag
        working-directory: apps/mobile
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Generate the native project
        working-directory: apps/mobile
        run: vp exec -- expo prebuild --platform android --no-install

      # Gradle downloads the SDK packages the build needs and the runner image
      # lacks (the NDK, the platform, CMake: React Native and the Android Gradle
      # Plugin name their versions) into ANDROID_HOME. What it added is kept as
      # one archive. A cache saved by a tag's run is read only by runs of the
      # same tag, so these save a retried release, not the next one.
      - name: Restore the Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk-packages.tar
          key: android-sdk-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Unpack the Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: tar -xf "$RUNNER_TEMP/android-sdk-packages.tar" -C "$ANDROID_HOME"

      - name: List the SDK packages before the build
        run: (cd "$ANDROID_HOME" && shopt -s nullglob && printf '%s\n' build-tools/* cmake/* ndk/* platforms/* | sort) > "$RUNNER_TEMP/sdk-before"

      - name: Restore Gradle's caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The Android Gradle Plugin signs with the injected key in place of the
      # generated project's release signing config, so nothing about signing
      # is committed. The key is on disk only for this step and the next.
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The certificate's digest is public: it is what a phone compares an
      # update against, and what a maintainer compares with the kept key.
      - name: Check the signature
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          mkdir -p dist/android
          apk="dist/android/j3-bots-$VERSION-android-arm64.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | grep -E 'certificate (DN|SHA-256 digest)'

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Pack the SDK packages Gradle added
        id: sdk-added
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          (cd "$ANDROID_HOME" && shopt -s nullglob && printf '%s\n' build-tools/* cmake/* ndk/* platforms/* | sort) > "$RUNNER_TEMP/sdk-after"
          comm -13 "$RUNNER_TEMP/sdk-before" "$RUNNER_TEMP/sdk-after" > "$RUNNER_TEMP/sdk-added"
          if [[ -s "$RUNNER_TEMP/sdk-added" ]]; then
            echo "Gradle added:"
            cat "$RUNNER_TEMP/sdk-added"
            tar -cf "$RUNNER_TEMP/android-sdk-packages.tar" -C "$ANDROID_HOME" -T "$RUNNER_TEMP/sdk-added"
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the SDK packages
        if: steps.sdk-added.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk-packages.tar
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

  # SHA256SUMS of both archives and install.sh, which install.sh checks a
  # download against. It reads files and runs none of them.
  checksums:
    name: Checksums and install script
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the install script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-server-linux-*
          path: server
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          mkdir checksums
          cp scripts/install.sh checksums/
          (cd server && sha256sum -- *.tar.gz) > checksums/SHA256SUMS
          (cd checksums && sha256sum -- install.sh) >> checksums/SHA256SUMS
          cat checksums/SHA256SUMS

      - name: Hand them to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-checksums
          path: |
            checksums/SHA256SUMS
            checksums/install.sh
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to the draft
    needs: [draft, desktop, server, android, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download what the jobs built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release

      # Each job's files go in a directory of their own: two with the same
      # name would overwrite each other on the release.
      - name: Check no two files share a name
        run: |
          duplicates="$(find release -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Files built by more than one job share a name: $duplicates"
            exit 1
          fi

      # Never onto a published release: what installed apps already read
      # changes only through a new version.
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::The release for $GITHUB_REF_NAME is not a draft; nothing is uploaded to it."
            exit 1
          fi
          find release -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
