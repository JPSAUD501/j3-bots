# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The desktop app's packages: AppImage and deb on Linux, dmg and zip on macOS,
# an NSIS installer on Windows (the targets T3 Code builds). The app is
# unsigned for now, and the macOS and Windows artifacts say so in their names;
# see docs/operations/releasing.md.
#
# The names are the product's (docs/product/concepts.md, Names). The app id is
# a development placeholder until the ids of a published build are chosen;
# `appId` matches `APP_ID` in src/identity.ts.

# Settling the app id also means setting `desktopName` (under `extraMetadata`)
# to that reverse-DNS id and `linux.syncDesktopName: true`, so the installed
# desktop file is named after it: without both, GNOME on Wayland refuses the
# global shortcut without telling the app.
appId: dev.j3bots.desktop
productName: J3 Bots
copyright: Copyright © J3 Bots contributors
# The workspace's package name, `@j3-bots/desktop`, would name the deb and
# the updater's cache.
extraMetadata:
  name: j3-bots

directories:
  output: release

# Everything the app runs is bundled into dist (`vp pack`), so it carries no
# node_modules.
files:
  - dist/**
  - package.json
# The web client's build, which the main process reads beside the app's asar.
# Each platform local mode runs on adds its server runtime below
# (`server-runtime`), which `pnpm release --server-runtime` builds into
# dist/release/server-runtime/<platform>-<arch>.
extraResources:
  - from: ../web/dist
    to: web/dist
npmRebuild: false
# Fails a package that lacks the server runtime its platform needs, or carries
# one where local mode does not run.
afterPack: ./scripts/afterPack.ts
# The app's icons, which the design tokens draw (packages/design-tokens,
# `generate`): a set of sizes for Linux, an icon file holding each size
# Windows draws, and one plate for macOS. Each platform names its own below.

# Links to the app (`j3bots://bot/<id>`, `room/<id>`, `pair?…`): declared in
# the macOS app's Info.plist and the Linux packages' desktop entries. The app
# also names itself their handler as it starts (src/linkHandler.ts), which is
# what registers them on Windows: the NSIS installer does not.
protocols:
  - name: J3 Bots
    schemes: [j3bots]

# The update feed: draft releases on GitHub, which a maintainer publishes.
publish:
  provider: github
  owner: JPSAUD501
  repo: j3-bots
  releaseType: draft

# The static AppImage runtime, so a system with only FUSE 3 (Ubuntu 24.04 and
# later) needs no libfuse2, as T3 Code pins it.
toolsets:
  appimage: "1.0.3"
linux:
  target: [AppImage, deb]
  executableName: j3-bots
  category: Utility
  synopsis: Persistent AI teammates on your own machine
  maintainer: J3 Bots contributors
  icon: ../../packages/design-tokens/generated/icons/desktop
  extraResources:
    - from: ../../dist/release/server-runtime/linux-${arch}
      to: server-runtime
# electron-updater replaces an AppImage in place only when its name has no
# x.y.z version; with one, it leaves a second file beside the first.
appImage:
  artifactName: J3-Bots-${arch}.${ext}
deb:
  artifactName: j3-bots_${version}_${arch}.${ext}

mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: ../../packages/design-tokens/generated/icons/mac.png
  # Ad hoc: no Developer ID, which Apple Silicon still needs to run the app at all.
  identity: "-"
  artifactName: J3-Bots-${version}-${arch}-unsigned.${ext}
  # Apple Silicon only: no runtime is built for Intel Macs, where the app only
  # connects to a server, so the x64 build finds none here.
  extraResources:
    - from: ../../dist/release/server-runtime/darwin-${arch}
      to: server-runtime

win:
  target: nsis
  icon: ../../packages/design-tokens/generated/icons/desktop.ico
  artifactName: J3-Bots-Setup-${version}-unsigned.${ext}
  extraResources:
    - from: ../../dist/release/server-runtime/win32-${arch}
      to: server-runtime
