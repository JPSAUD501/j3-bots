<!doctype html>
<meta charset="utf-8" />
<script>
  // The page a connector's app is drawn in (docs/architecture/security.md,
  // "Connector apps"). The client that framed it posts it the app's document,
  // its own narrower policy first, and it writes that over itself, which
  // removes this listener; it takes nothing else. Only in a sandbox, where its
  // origin is opaque: on its own it does nothing.
  (function () {
    if (window.origin !== "null") return;
    window.addEventListener("message", function written(event) {
      if (event.source !== window.parent || typeof event.data !== "string") return;
      window.removeEventListener("message", written);
      document.open();
      document.write(event.data);
      document.close();
    });
  })();
</script>
