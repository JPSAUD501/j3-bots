<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>J3 Bots</title>
    <script>
      // Sets the theme before the first paint, so a dark page never flashes light.
      // Reads what src/preferences/preferences.ts writes; keep the key in step with it.
      (() => {
        let appearance = "system";
        try {
          appearance = localStorage.getItem("j3:appearance") ?? "system";
        } catch {}
        const dark =
          appearance === "dark" ||
          (appearance !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
