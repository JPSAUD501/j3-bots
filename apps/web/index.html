<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>J3 Bots</title>
    <script>
      // Sets the appearance and the theme before the first paint, so a dark page never
      // flashes light. Reads what src/preferences/preferences.ts and src/themes/look.ts
      // write; keep the keys in step with them.
      (() => {
        let appearance = "system";
        try {
          appearance = localStorage.getItem("j3:appearance") ?? "system";
        } catch {}
        const dark =
          appearance === "dark" ||
          (appearance !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        // The theme shown last, as src/themes/look.ts keeps it.
        try {
          const look = JSON.parse(localStorage.getItem("j3:theme-look") ?? "null");
          if (
            typeof look?.colors === "string" &&
            typeof look.css === "string" &&
            typeof look.id === "string"
          ) {
            const colors = document.createElement("style");
            colors.id = "j3-theme";
            colors.textContent = look.colors;
            document.head.append(colors);
            if (look.css !== "") {
              const own = document.createElement("style");
              own.id = "j3-theme-css";
              // A computer's only, as src/themes/look.ts places it.
              own.media = "(hover: hover) and (pointer: fine)";
              own.textContent = look.css;
              document.head.append(own);
            }
            document.documentElement.dataset.theme = look.id;
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
