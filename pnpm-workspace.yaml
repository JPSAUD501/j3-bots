packages:
  - apps/*
  - packages/*
  # The end-to-end evals against real models, run on demand.
  - evals
  # T3 Code's contracts at the engine pin, as their own package: @t3tools/contracts.
  - packages/engine-t3/vendor/*

allowBuilds:
  bufferutil: false
  # Squirrel.Windows, which electron-builder carries; the app builds an NSIS installer instead.
  electron-winstaller: false
  # Its install script only prints a notice.
  core-js: false
  esbuild: true
  # Global input for screen recordings: its prebuilt binaries cover every
  # desktop target, so its install script (node-gyp-build) never compiles.
  uiohook-napi: false
  utf-8-validate: false

# One version of every shared dependency. The Effect packages must match the
# versions T3 Code pins at the engine commit in engine.json: the engine adapter
# decodes the engine's protocol with T3 Code's own schemas, which fail under a
# second copy of Effect.
catalog:
  "@effect/platform-node": 4.1.5
  "@effect/sql-sqlite-node": 4.1.5
  "@effect/tsgo": 0.67.1
  "@effect/vitest": 4.1.5
  "@types/node": 24.12.4
  # React is shared by the web client and the mobile client.
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.1.5
  # The DOM a web test that needs one runs in. At the root, so every package's
  # vite-plus resolves the same way: one vitest for all of them.
  happy-dom: 21.0.4
  knip: 6.34.0
  react: 19.3.0
  react-dom: 19.3.0
  vite-plus: 1.4.0

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  # The patch below makes @effect/vitest import vite-plus/test instead.
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  # PDF.js's canvas for Node, a native binary per platform. The web client
  # draws on the browser's own canvas and never loads it.
  "pdfjs-dist>@napi-rs/canvas": "-"
  # Vite+ ships its own Vite build; every dependency on vite resolves to it.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  # Its spawner stops a child on Windows with `taskkill` from the search path,
  # where one the operator's PATH puts first would be run instead; the patch
  # runs Windows' own, in System32. Still so in 4.1.6.
  "@effect/platform-node-shared@4.1.5": patches/@effect__platform-node-shared@4.1.5.patch
  # From T3 Code (MIT): points @effect/vitest at the Vitest that Vite+ bundles.
  "@effect/vitest@4.1.5": patches/@effect__vitest@4.1.5.patch

# Unmet peers fail resolution, so a pin outside a dependency's peer range is
# caught when the lockfile changes instead of scrolling past as a warning.
strictPeerDependencies: true

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
